[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "samsagent"
version = "0.1.0"
description = "Persistent local-model research agent"
requires-python = ">=3.12"
dependencies = [
  "ollama>=0.6,<1",
  "mcp>=1.20,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[project.scripts]
samsagent = "samsagent.web:main"
samsagent-machine = "samsagent.machine:main"

[tool.setuptools.package-data]
samsagent = ["static/*"]

[tool.setuptools.packages.find]
include = ["samsagent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

